<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Modern E-Commerce PWA</title>

  <!-- PWA Metadata & Manifest -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TechStore">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20 md:pb-0 min-h-screen flex flex-direction-col justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      
      <!-- Logo -->
      <a href="#" class="text-2xl font-black tracking-tight text-blue-600 flex items-center gap-2">
        <i class="fa-solid fa-bolt text-yellow-500"></i> TechStore
      </a>

      <!-- Qidiruv (Desktop) -->
      <div class="hidden md:flex flex-1 max-w-md mx-6 relative">
        <input type="text" id="searchInputDesktop" oninput="handleSearch(this.value)"
               class="w-full bg-gray-100 border-none rounded-full py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
      </div>

      <!-- O'ng taraf: Tillarchik & Install & Savat -->
      <div class="flex items-center gap-2">
        
        <!-- Tilni tanlash -->
        <div class="relative inline-block">
          <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 text-gray-700 text-xs md:text-sm font-semibold py-2 px-3 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
          </select>
        </div>

        <!-- PWA Install Tugmasi -->
        <button id="installBtn" onclick="triggerInstall()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-all flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-download"></i> <span class="hidden sm:inline" data-i18n="installApp">Ilovani yuklash</span>
        </button>

        <!-- Savat Tugmasi -->
        <button onclick="toggleCart(true)" class="relative bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-lg transition-all shadow-md flex items-center justify-center">
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center shadow-sm">0</span>
        </button>
      </div>
    </div>

    <!-- Mobil Qidiruv -->
    <div class="px-4 pb-3 md:hidden">
      <div class="relative">
        <input type="text" id="searchInputMobile" oninput="handleSearch(this.value)"
               class="w-full bg-gray-100 border-none rounded-full py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
      </div>
    </div>
  </header>

  <!-- Asosiy Tarkib -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1">

    <!-- Kategoriyalar -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-4 mb-4" id="categoryList">
      <!-- JavaScript orqali generatsiya qilinadi -->
    </div>

    <!-- Mahsulotlar Tarmog'i -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6" id="productGrid">
      <!-- JavaScript orqali generatsiya qilinadi -->
    </div>
  </main>

  <!-- Bottom Navigation (Mobil uchun) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden z-30 safe-bottom">
    <div class="grid grid-cols-3 py-2 text-center text-xs">
      <button class="text-blue-600 flex flex-col items-center gap-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span data-i18n="home">Asosiy</span>
      </button>
      <button onclick="toggleCart(true)" class="text-gray-500 hover:text-blue-600 flex flex-col items-center gap-1 relative">
        <i class="fa-solid fa-bag-shopping text-lg"></i>
        <span data-i18n="cart">Savat</span>
      </button>
      <button onclick="showPwaGuide()" class="text-gray-500 hover:text-blue-600 flex flex-col items-center gap-1">
        <i class="fa-solid fa-mobile-screen-button text-lg"></i>
        <span data-i18n="app">Ilova</span>
      </button>
    </div>
  </div>

  <!-- Savat Modali (Slide Drawer) -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="cartPanel" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
      
      <!-- Header -->
      <div class="p-4 border-b flex items-center justify-between bg-gray-50">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-blue-600"></i> <span data-i18n="cart">Savat</span>
        </h2>
        <button onclick="toggleCart(false)" class="p-2 text-gray-400 hover:text-gray-600 rounded-full">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Items List -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cartItemsContainer">
        <!-- JS dynamically renders items -->
      </div>

      <!-- Footer -->
      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex items-center justify-between text-base font-bold text-gray-800">
          <span data-i18n="total">Jami summasi:</span>
          <span id="cartTotalSum" class="text-xl text-blue-600">$0</span>
        </div>
        <button onclick="openCheckoutModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-check"></i> <span data-i18n="checkout">Buyurtma berish</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-xl font-bold text-gray-800" data-i18n="checkout">Buyurtma berish</h3>
      <form onsubmit="confirmOrder(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1" data-i18n="fullName">Ism va Familiya</label>
          <input type="text" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1" data-i18n="phone">Telefon raqam</label>
          <input type="tel" required placeholder="+998 90 123 45 67" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeCheckoutModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded-lg" data-i18n="cancel">Bekor qilish</button>
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg" data-i18n="confirm">Tasdiqlash</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PWA Guide Modal -->
  <div id="pwaGuideModal" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
      <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-mobile-screen"></i>
      </div>
      <h3 class="text-lg font-bold" data-i18n="pwaGuideTitle">Ilovani ekranga o'rnatish</h3>
      <p class="text-xs text-gray-600 leading-relaxed" data-i18n="pwaGuideDesc">
        Smartfoningizda ushbu saytni alohida ilova kabi ishlatish uchun brauzer menyusidan <b>"Ekranga qo'shish" (Add to Home Screen)</b> tugmasini bosing.
      </p>
      <button onclick="document.getElementById('pwaGuideModal').classList.add('hidden')" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm" data-i18n="ok">Tushunarli</button>
    </div>
  </div>
