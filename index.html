<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Uzum Market Style PWA</title>

  <!-- PWA Metadata -->
  <meta name="theme-color" content="#7000ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TechStore">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body id="appBody" class="bg-gray-50 text-gray-900 pb-20 md:pb-0 min-h-screen flex flex-col justify-between">

  <!-- Header (Uzum Market Uslubida) -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <!-- Logo -->
      <a href="#" onclick="resetFilter()" class="text-2xl font-black tracking-tight text-[#7000ff] flex items-center gap-1.5 shrink-0">
        <i class="fa-solid fa-bolt text-yellow-500"></i> TechStore
      </a>

      <!-- Katalog Tugmasi -->
      <button onclick="filterCategory('all')" class="hidden sm:flex items-center gap-2 bg-[#f2e8ff] hover:bg-[#e4d1ff] text-[#7000ff] font-semibold px-4 py-2.5 rounded-xl transition-all shrink-0">
        <i class="fa-solid fa-border-all text-lg"></i>
        <span data-i18n="catalog">Katalog</span>
      </button>

      <!-- Qidiruv paneli -->
      <div class="flex-1 max-w-xl mx-2">
        <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden focus-within:border-[#7000ff] transition-all bg-white">
          <input type="text" id="searchInput" oninput="handleSearch(this.value)"
                 class="w-full py-2.5 px-4 text-sm text-gray-800 outline-none placeholder-gray-400"
                 placeholder="Mahsulotlar va turkumlar izlash">
          <button class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-5 py-2.5 transition-all border-l border-gray-200 shrink-0">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
          </button>
        </div>
      </div>

      <!-- O'ng taraf: Kirish, Saralangan, Savat, Til -->
      <div class="flex items-center gap-1 sm:gap-4 shrink-0">
        
        <!-- Tilni tanlash -->
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 text-gray-700 text-xs font-semibold py-2 px-2.5 rounded-lg border-none focus:ring-2 focus:ring-[#7000ff] outline-none cursor-pointer hidden md:block">
          <option value="uz">🇺🇿 UZ</option>
          <option value="ru">🇷🇺 RU</option>
          <option value="en">🇬🇧 EN</option>
        </select>

        <!-- Kirish (Uzum ID) -->
        <button onclick="openAuthModal()" class="flex items-center gap-2 text-gray-800 hover:text-[#7000ff] font-medium px-2 py-1.5 rounded-lg transition-all text-sm">
          <i class="fa-regular fa-user text-xl"></i>
          <span class="hidden md:inline" data-i18n="login">Kirish</span>
        </button>

        <!-- Saralangan -->
        <button onclick="filterFavorites()" class="flex items-center gap-2 text-gray-800 hover:text-[#7000ff] font-medium px-2 py-1.5 rounded-lg transition-all text-sm relative">
          <i class="fa-regular fa-heart text-xl"></i>
          <span class="hidden md:inline" data-i18n="favorites">Saralangan</span>
          <span id="favBadge" class="hidden absolute -top-1 -right-1 bg-[#7000ff] text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">0</span>
        </button>

        <!-- Savat -->
        <button onclick="toggleCart(true)" class="flex items-center gap-2 text-gray-800 hover:text-[#7000ff] font-medium px-2 py-1.5 rounded-lg transition-all text-sm relative">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span class="hidden md:inline" data-i18n="cart">Savat</span>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-[#7000ff] text-white text-[10px] font-bold rounded-full h-4.5 w-4.5 flex items-center justify-center">0</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Asosiy Tarkib -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- Kategoriyalar -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-4 mb-4" id="categoryList"></div>

    <!-- Mahsulotlar Tarmog'i -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6" id="productGrid"></div>
  </main>

  <!-- Mobil Quyi Navigatsiya Bar (Bottom Bar) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 md:hidden z-30 safe-bottom">
    <div class="grid grid-cols-4 py-2 text-center text-[11px]">
      <button onclick="resetFilter()" class="text-[#7000ff] flex flex-col items-center gap-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span data-i18n="home">Asosiy</span>
      </button>
      <button onclick="filterFavorites()" class="text-gray-500 hover:text-[#7000ff] flex flex-col items-center gap-1">
        <i class="fa-regular fa-heart text-lg"></i>
        <span data-i18n="favorites">Saralangan</span>
      </button>
      <button onclick="toggleCart(true)" class="text-gray-500 hover:text-[#7000ff] flex flex-col items-center gap-1 relative">
        <i class="fa-solid fa-bag-shopping text-lg"></i>
        <span data-i18n="cart">Savat</span>
      </button>
      <button onclick="openAuthModal()" class="text-gray-500 hover:text-[#7000ff] flex flex-col items-center gap-1">
        <i class="fa-regular fa-user text-lg"></i>
        <span data-i18n="login">Kirish</span>
      </button>
    </div>
  </div>

  <!-- MAHSULOT BATAFSIL MODALI (Product Details Popup) -->
  <div id="productDetailModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-3 md:p-6">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-5 md:p-8 space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      
      <button onclick="closeProductModal()" class="absolute top-4 right-4 z-10 w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <!-- Rasm -->
        <div class="bg-gray-50 p-4 rounded-2xl flex items-center justify-center">
          <img id="detailImg" src="" class="w-full h-64 object-contain rounded-xl">
        </div>

        <!-- Ma'lumotlar -->
        <div class="space-y-4">
          <div>
            <span id="detailCat" class="bg-[#f2e8ff] text-[#7000ff] text-[11px] font-bold px-2.5 py-1 rounded-full uppercase">Kategoriya</span>
            <h2 id="detailTitle" class="text-xl md:text-2xl font-extrabold text-gray-900 mt-2">Mahsulot nomi</h2>
            
            <div class="flex items-center gap-2 mt-1 text-xs text-gray-500">
              <span class="text-amber-500 font-bold flex items-center gap-1">
                <i class="fa-solid fa-star"></i> <span id="detailRating">4.9</span>
              </span>
              <span>•</span>
              <span id="detailReviews">128 ta sharh</span>
            </div>
          </div>

          <div class="border-t border-b py-3">
            <div class="flex items-baseline gap-3">
              <span id="detailPrice" class="text-2xl font-black text-[#7000ff]">$0</span>
              <span id="detailOldPrice" class="text-sm font-semibold text-gray-400 line-through">$0</span>
            </div>
          </div>

          <div class="space-y-1">
            <h4 class="text-xs font-bold text-gray-800 uppercase">Tavsif:</h4>
            <p id="detailDesc" class="text-xs text-gray-600 leading-relaxed"></p>
          </div>

          <!-- Miqdor va Xarid tugmalari -->
          <div class="space-y-3 pt-2">
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold text-gray-700">Miqdori:</span>
              <div class="flex items-center border rounded-xl bg-gray-50 p-1">
                <button onclick="adjustDetailQty(-1)" class="w-7 h-7 bg-white rounded-lg text-gray-700 font-bold text-sm shadow-sm">-</button>
                <span id="detailQty" class="px-3 text-sm font-bold">1</span>
                <button onclick="adjustDetailQty(1)" class="w-7 h-7 bg-white rounded-lg text-gray-700 font-bold text-sm shadow-sm">+</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="addDetailToCart()" class="bg-[#f2e8ff] hover:bg-[#e4d1ff] text-[#7000ff] font-bold py-3 px-3 rounded-2xl text-xs transition-all flex items-center justify-center gap-1">
                <i class="fa-solid fa-cart-plus"></i> <span data-i18n="addToCart">Savatga</span>
              </button>
              <button onclick="buyNowFromDetail()" class="bg-[#7000ff] hover:bg-[#5c00d6] text-white font-bold py-3 px-3 rounded-2xl text-xs shadow-md transition-all flex items-center justify-center gap-1">
                <i class="fa-solid fa-bolt"></i> <span data-i18n="buyNow">Xarid qilish</span>
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Uzum ID Kirish Modali -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
      <button onclick="closeAuthModal()" class="absolute top-5 right-5 w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="text-center space-y-3 pt-2">
        <div class="inline-flex items-center justify-center gap-1.5 bg-[#f2e8ff] px-4 py-1.5 rounded-full">
          <i class="fa-solid fa-bolt text-[#7000ff] text-base"></i>
          <span class="text-[#7000ff] font-black text-lg">TechStore <span class="font-bold text-gray-700">ID</span></span>
        </div>
        <h2 class="text-2xl font-extrabold text-gray-900" data-i18n="uzumLoginTitle">TechStore'ga kirish</h2>
      </div>

      <div id="stepPhone" class="space-y-5">
        <input type="tel" id="userPhone" placeholder="+998 00 000-00-00" value="+998 "
               class="w-full bg-[#f2f4f7] border-none rounded-2xl py-4 px-5 text-gray-900 font-semibold text-lg focus:ring-2 focus:ring-[#7000ff] outline-none">
        <button onclick="sendSmsCode()" class="w-full bg-[#7000ff] hover:bg-[#5c00d6] text-white font-bold py-4 rounded-2xl text-base shadow-md" data-i18n="getCode">
          Kodni olish
        </button>
        <p class="text-[11px] text-gray-500 text-center leading-relaxed">
          Davom etgan holda shaxsiy ma'lumotlarni qayta ishlash siyosatiga rozilik bildirasiz
        </p>
      </div>

      <div id="stepOtp" class="space-y-5 hidden">
        <p class="text-xs text-center text-gray-600"><span id="sentPhoneDisplay" class="font-bold text-gray-900"></span> raqamiga yuborilgan 4 xonali kodni kiriting</p>
        <div class="flex justify-center gap-3 py-2">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border focus:border-[#7000ff] outline-none">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border focus:border-[#7000ff] outline-none">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border focus:border-[#7000ff] outline-none">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border focus:border-[#7000ff] outline-none">
        </div>
        <button onclick="verifyOtp()" class="w-full bg-[#7000ff] text-white font-bold py-4 rounded-2xl" data-i18n="confirm">Tasdiqlash</button>
      </div>
    </div>
  </div>

  <!-- Savat Drawer -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="cartPanel" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
      <div class="p-4 border-b flex items-center justify-between bg-gray-50">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-bag-shopping text-[#7000ff]"></i> <span data-i18n="cart">Savat</span>
        </h2>
        <button onclick="toggleCart(false)" class="p-2 text-gray-400 hover:text-gray-600 rounded-full">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cartItemsContainer"></div>
      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex items-center justify-between text-base font-bold text-gray-800">
          <span data-i18n="total">Jami summasi:</span>
          <span id="cartTotalSum" class="text-xl text-[#7000ff]">$0</span>
        </div>
        <button onclick="checkoutCart()" class="w-full bg-[#7000ff] hover:bg-[#5c00d6] text-white font-bold py-3 rounded-xl shadow-lg transition-all" data-i18n="checkout">
          Buyurtma berish
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logika -->
  <script>
    const translations = {
      uz: {
        searchPlaceholder: "Mahsulotlar va turkumlar izlash",
        catalog: "Katalog",
        login: "Kirish",
        favorites: "Saralangan",
        cart: "Savat",
        uzumLoginTitle: "TechStore'ga kirish",
        getCode: "Kodni olish",
        confirm: "Tasdiqlash",
        emptyCart: "Savatchangiz hozircha bo'sh",
        total: "Jami summasi:",
        checkout: "Buyurtma berish",
        addToCart: "Savatga",
        buyNow: "Xarid qilish",
        home: "Asosiy",
        all: "Barchasi",
        phones: "Telefonlar",
        laptops: "Noutbuklar",
        accessories: "Aksessuarlar"
      },
      ru: {
        searchPlaceholder: "Искать товары и категории",
        catalog: "Каталог",
        login: "Войти",
        favorites: "Избранное",
        cart: "Корзина",
        uzumLoginTitle: "Вход в TechStore",
        getCode: "Получить код",
        confirm: "Подтвердить",
        emptyCart: "Ваша корзина пуста",
        total: "Итого:",
        checkout: "Оформить заказ",
        addToCart: "В корзину",
        buyNow: "Купить сейчас",
        home: "Главная",
        all: "Все",
        phones: "Телефоны",
        laptops: "Ноутбуки",
        accessories: "Аксессуары"
      },
      en: {
        searchPlaceholder: "Search products and categories",
        catalog: "Catalog",
        login: "Sign In",
        favorites: "Favorites",
        cart: "Cart",
        uzumLoginTitle: "Sign in to TechStore",
        getCode: "Get code",
        confirm: "Confirm",
        emptyCart: "Your cart is empty",
        total: "Total:",
        checkout: "Checkout",
        addToCart: "Add to Cart",
        buyNow: "Buy Now",
        home: "Home",
        all: "All",
        phones: "Phones",
        laptops: "Laptops",
        accessories: "Accessories"
      }
    };

    let currentLang = localStorage.getItem('appLang') || 'uz';

    const products = [
      { id: 1, name: "iPhone 15 Pro Max 256GB", cat: "phones", price: 1199, oldPrice: 1299, rating: 4.9, reviews: 340, desc: "A17 Pro chip, titan korpus va professional uchta kamera.", img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500" },
      { id: 2, name: "MacBook Air M2 13.6 inch", cat: "laptops", price: 1099, oldPrice: 1199, rating: 4.8, reviews: 215, desc: "Yupqa va yengil dizayn, M2 chip hamda 18 soat batareya.", img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500" },
      { id: 3, name: "AirPods Pro 2 Type-C", cat: "accessories", price: 239, oldPrice: 269, rating: 4.9, reviews: 512, desc: "Faol shovqinni bekor qilish (ANC) va shaffoflik rejimi.", img: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500" },
      { id: 4, name: "Samsung Galaxy S24 Ultra", cat: "phones", price: 1249, oldPrice: 1349, rating: 4.7, reviews: 180, desc: "Galaxy AI sun'iy intellekti, S Pen va 200MP kamera.", img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500" }
    ];

    let cart = JSON.parse(localStorage.getItem('cartData') || '[]');
    let favorites = JSON.parse(localStorage.getItem('favData') || '[]');
    let selectedCategory = 'all';
    let searchQuery = '';
    let showOnlyFavs = false;
    let selectedDetailProduct = null;
    let detailQtyValue = 1;

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('appLang', lang);
      document.getElementById('langSelect').value = lang;
      updateUI();
    }

    function updateUI() {
      const t = translations[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      renderCategories();
      renderProducts();
      renderCart();
      updateFavBadge();
    }

    function renderCategories() {
      const t = translations[currentLang];
      const categories = [
        { id: 'all', name: t.all },
        { id: 'phones', name: t.phones },
        { id: 'laptops', name: t.laptops },
        { id: 'accessories', name: t.accessories }
      ];

      const container = document.getElementById('categoryList');
      container.innerHTML = categories.map(c => `
        <button onclick="filterCategory('${c.id}')" 
          class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${selectedCategory === c.id && !showOnlyFavs ? 'bg-[#7000ff] text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
          ${c.name}
        </button>
      `).join('');
    }

    function renderProducts() {
      const filtered = products.filter(p => {
        const matchCat = selectedCategory === 'all' || p.cat === selectedCategory;
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        const matchFav = showOnlyFavs ? favorites.includes(p.id) : true;
        return matchCat && matchSearch && matchFav;
      });

      const grid = document.getElementById('productGrid');
      grid.innerHTML = filtered.map(p => {
        const isFav = favorites.includes(p.id);
        return `
        <div onclick="openProductModal(${p.id})" class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between cursor-pointer group relative">
          <button onclick="event.stopPropagation(); toggleFav(${p.id})" class="absolute top-4 right-4 z-10 w-8 h-8 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-gray-400 hover:text-red-500 shadow-sm transition-all">
            <i class="${isFav ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'}"></i>
          </button>
          <div>
            <div class="overflow-hidden rounded-xl mb-3 bg-gray-50">
              <img src="${p.img}" class="w-full h-36 object-contain group-hover:scale-105 transition-all duration-300">
            </div>
            <h3 class="font-bold text-gray-800 text-sm line-clamp-1 group-hover:text-[#7000ff] transition-colors">${p.name}</h3>
            <div class="flex items-center gap-1.5 text-[11px] text-gray-500 mt-1">
              <span class="text-amber-500 font-bold"><i class="fa-solid fa-star"></i> ${p.rating}</span>
              <span>(${p.reviews})</span>
            </div>
            <div class="mt-2">
              <span class="text-[#7000ff] font-black text-base">$${p.price}</span> <span class="text-xs text-gray-400 line-through ml-1">$${p
