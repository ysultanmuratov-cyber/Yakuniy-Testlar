<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Modern E-Commerce</title>

  <!-- PWA Metadata -->
  <meta name="theme-color" content="#7000ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TechStore">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body id="appBody" class="bg-gray-50 text-gray-900 pb-20 md:pb-0 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Header (Uzum Market Uslubida) -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <!-- Logo -->
      <a href="#" onclick="resetFilter()" class="text-2xl font-black tracking-tight text-[#7000ff] flex items-center gap-1.5 shrink-0">
        <i class="fa-solid fa-bolt text-yellow-500"></i> TechStore
      </a>

      <!-- Katalog Tugmasi -->
      <button onclick="filterCategory('all')" class="hidden sm:flex items-center gap-2 bg-[#f2e8ff] hover:bg-[#e4d1ff] text-[#7000ff] font-semibold px-4 py-2.5 rounded-xl transition-all shrink-0">
        <i class="fa-solid fa-border-all text-lg"></i>
        <span data-i18n="catalog">Katalog</span>
      </button>

      <!-- Qidiruv paneli -->
      <div class="flex-1 max-w-xl mx-2">
        <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden focus-within:border-[#7000ff] transition-all bg-white">
          <input type="text" id="searchInput" oninput="handleSearch(this.value)"
                 class="w-full py-2.5 px-4 text-sm text-gray-800 outline-none placeholder-gray-400"
                 placeholder="Mahsulotlar va turkumlar izlash">
          <button class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-5 py-2.5 transition-all border-l border-gray-200 shrink-0">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
          </button>
        </div>
      </div>

      <!-- O'ng taraf: Kirish, Saralangan, Savat -->
      <div class="flex items-center gap-1 sm:gap-4 shrink-0">
        
        <!-- Kirish (Uzum ID Style Modal) -->
        <button onclick="openAuthModal()" class="flex items-center gap-2 text-gray-800 hover:text-[#7000ff] font-medium px-2 py-1.5 rounded-lg transition-all text-sm">
          <i class="fa-regular fa-user text-xl"></i>
          <span class="hidden md:inline" data-i18n="login">Kirish</span>
        </button>

        <!-- Saralangan -->
        <button onclick="filterFavorites()" class="flex items-center gap-2 text-gray-800 hover:text-[#7000ff] font-medium px-2 py-1.5 rounded-lg transition-all text-sm relative">
          <i class="fa-regular fa-heart text-xl"></i>
          <span class="hidden md:inline" data-i18n="favorites">Saralangan</span>
          <span id="favBadge" class="hidden absolute -top-1 -right-1 bg-[#7000ff] text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">0</span>
        </button>

        <!-- Savat -->
        <button onclick="toggleCart(true)" class="flex items-center gap-2 text-gray-800 hover:text-[#7000ff] font-medium px-2 py-1.5 rounded-lg transition-all text-sm relative">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span class="hidden md:inline" data-i18n="cart">Savat</span>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-[#7000ff] text-white text-[10px] font-bold rounded-full h-4.5 w-4.5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Asosiy Tarkib -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- Kategoriyalar -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-4 mb-4" id="categoryList"></div>

    <!-- Mahsulotlar Tarmog'i -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6" id="productGrid"></div>
  </main>

  <!-- Uzum ID Uslubidagi Kirish Modali (Modal Window) -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative transition-all transform scale-100">
      
      <!-- Yopish tugmasi -->
      <button onclick="closeAuthModal()" class="absolute top-5 right-5 w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full flex items-center justify-center transition-all">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Logo & Sarlavha -->
      <div class="text-center space-y-3 pt-2">
        <div class="inline-flex items-center justify-center gap-1.5 bg-[#f2e8ff] px-4 py-1.5 rounded-full">
          <i class="fa-solid fa-bolt text-[#7000ff] text-base"></i>
          <span class="text-[#7000ff] font-black text-lg tracking-tight">TechStore <span class="font-bold text-gray-700">ID</span></span>
        </div>
        <h2 id="authTitle" class="text-2xl font-extrabold text-gray-900 tracking-tight" data-i18n="uzumLoginTitle">
          TechStore'ga kirish
        </h2>
      </div>

      <!-- 1-BOSQICH: Telefon raqam kiritish -->
      <div id="stepPhone" class="space-y-5">
        <div class="relative">
          <input type="tel" id="userPhone" placeholder="+998 00 000-00-00" value="+998 "
                 class="w-full bg-[#f2f4f7] border-none rounded-2xl py-4 px-5 text-gray-900 font-semibold text-lg focus:ring-2 focus:ring-[#7000ff] outline-none transition-all placeholder-gray-400">
        </div>

        <button onclick="sendSmsCode()" class="w-full bg-[#7000ff] hover:bg-[#5c00d6] active:scale-[0.98] text-white font-bold py-4 rounded-2xl text-base shadow-md transition-all duration-200" data-i18n="getCode">
          Kodni olish
        </button>

        <!-- Oferta va Rozilik matni -->
        <p class="text-[11px] text-gray-500 text-center leading-relaxed px-2">
          Davom etgan holda men 
          <a href="#" class="underline hover:text-[#7000ff]">shaxsiy ma'lumotlarni qayta ishlash siyosatiga rozilik bildirasiz</a> va 
          <a href="#" class="underline hover:text-[#7000ff]">TechStore ID ommaviy oferta bilan rozi bo'laman</a>
        </p>
        <div class="text-center pt-1">
          <a href="#" class="text-xs font-semibold text-gray-500 hover:text-[#7000ff] underline">TechStore ID nima?</a>
        </div>
      </div>

      <!-- 2-BOSQICH: SMS Kodini kiritish -->
      <div id="stepOtp" class="space-y-5 hidden">
        <p class="text-xs text-center text-gray-600">
          <span id="sentPhoneDisplay" class="font-bold text-gray-900"></span> raqamiga yuborilgan 4 xonali kodni kiriting
        </p>

        <div class="flex justify-center gap-3 py-2">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border border-transparent focus:border-[#7000ff] focus:bg-white outline-none">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border border-transparent focus:border-[#7000ff] focus:bg-white outline-none">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border border-transparent focus:border-[#7000ff] focus:bg-white outline-none">
          <input type="text" maxlength="1" class="otp-input w-12 h-14 bg-[#f2f4f7] text-center text-xl font-bold rounded-xl border border-transparent focus:border-[#7000ff] focus:bg-white outline-none">
        </div>

        <button onclick="verifyOtp()" class="w-full bg-[#7000ff] hover:bg-[#5c00d6] text-white font-bold py-4 rounded-2xl text-base shadow-md transition-all" data-i18n="confirm">
          Tasdiqlash
        </button>

        <div class="text-center">
          <button onclick="backToPhoneStep()" class="text-xs text-[#7000ff] font-semibold hover:underline">
            Raqamni o'zgartirish
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Savat Drawer -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="cartPanel" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
      <div class="p-4 border-b flex items-center justify-between bg-gray-50">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-bag-shopping text-[#7000ff]"></i> <span data-i18n="cart">Savat</span>
        </h2>
        <button onclick="toggleCart(false)" class="p-2 text-gray-400 hover:text-gray-600 rounded-full">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cartItemsContainer"></div>
      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex items-center justify-between text-base font-bold text-gray-800">
          <span data-i18n="total">Jami summasi:</span>
          <span id="cartTotalSum" class="text-xl text-[#7000ff]">$0</span>
        </div>
        <button class="w-full bg-[#7000ff] hover:bg-[#5c00d6] text-white font-bold py-3 rounded-xl shadow-lg transition-all" data-i18n="checkout">
          Buyurtma berish
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logika -->
  <script>
    const translations = {
      uz: {
        catalog: "Katalog",
        login: "Kirish",
        favorites: "Saralangan",
        cart: "Savat",
        uzumLoginTitle: "TechStore'ga kirish",
        getCode: "Kodni olish",
        confirm: "Tasdiqlash",
        emptyCart: "Savatchangiz hozircha bo'sh",
        total: "Jami summasi:",
        checkout: "Buyurtma berish"
      }
    };

    const products = [
      { id: 1, name: "iPhone 15 Pro", cat: "phones", price: 999, img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400" },
      { id: 2, name: "MacBook Air M2", cat: "laptops", price: 1199, img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400" },
      { id: 3, name: "AirPods Pro 2", cat: "accessories", price: 249, img: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400" },
      { id: 4, name: "Samsung Galaxy S24", cat: "phones", price: 899, img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400" }
    ];

    let cart = JSON.parse(localStorage.getItem('cartData') || '[]');
    let favorites = JSON.parse(localStorage.getItem('favData') || '[]');

    function openAuthModal() {
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('authModal').classList.add('flex');
      backToPhoneStep();
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('authModal').classList.remove('flex');
    }

    function sendSmsCode() {
      const phone = document.getElementById('userPhone').value.trim();
      if (phone.length < 9) {
        alert("Iltimos, telefon raqamingizni to'liq kiriting!");
        return;
      }
      document.getElementById('sentPhoneDisplay').innerText = phone;
      document.getElementById('stepPhone').classList.add('hidden');
      document.getElementById('stepOtp').classList.remove('hidden');
    }

    function backToPhoneStep() {
      document.getElementById('stepOtp').classList.add('hidden');
      document.getElementById('stepPhone').classList.remove('hidden');
    }

    function verifyOtp() {
      alert("Tizimga muvaffaqiyatli kirdingiz!");
      closeAuthModal();
    }

    // OTP Auto focus input
    document.querySelectorAll('.otp-input').forEach((input, index, inputs) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
    });

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
          <div>
            <img src="${p.img}" class="w-full h-36 object-cover rounded-xl mb-3">
            <h3 class="font-bold text-gray-800 text-sm line-clamp-1">${p.name}</h3>
            <p class="text-[#7000ff] font-extrabold text-base mt-1">$${p.price}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-[#f2e8ff] hover:bg-[#7000ff] hover:text-white text-[#7000ff] text-xs font-bold py-2 rounded-xl transition-all">
            + Savatga qo'shish
          </button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const p = products.find(prod => prod.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) { existing.qty++; } else { cart.push({ ...p, qty: 1 }); }
      localStorage.setItem('cartData', JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItemsContainer');
      const badge = document.getElementById('cartBadge');
      const totalSum = document.getElementById('cartTotalSum');
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      badge.innerText = totalItems;
      totalSum.innerText = `$${totalPrice}`;

      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-10"><p class="text-sm">Savatchangiz hozircha bo'sh</p></div>`;
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between border-b pb-3">
          <div class="flex items-center gap-3">
            <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover">
            <div>
              <h4 class="font-bold text-xs text-gray-800">${item.name}</h4>
              <p class="text-[#7000ff] font-bold text-xs">$${item.price}</p>
            </div>
          </div>
          <span class="text-xs font-bold">x${item.qty}</span>
        </div>
      `).join('');
    }

    function toggleCart(open) {
      const drawer = document.getElementById('cartDrawer');
      const panel = document.getElementById('cartPanel');
      if (open) { drawer.classList.remove('opacity-0', 'pointer-events-none'); panel.classList.remove('translate-x-full'); }
      else { drawer.classList.add('opacity-0', 'pointer-events-none'); panel.classList.add('translate-x-full'); }
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>
